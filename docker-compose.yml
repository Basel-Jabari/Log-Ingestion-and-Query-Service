# Start everything with: docker compose up
# Start only the test DB: npm run up
# Stop and delete data: docker compose down -v
services:
    app:
        build: .
        # Forward termination signals and reap orphaned child processes
        init: true
        ports:
            - "8080:8080"
        environment:
            # Inside the compose network the database is reachable by the
            # service name "postgres" on its own port 5432, not on 5433
            DB_URL: postgres://postgres:liqs@postgres:5432/liqs
        depends_on:
            postgres:
                # Start the app only after PostgreSQL can accept connections
                condition: service_healthy
        deploy:
            resources:
                # Resource limits used during grading
                limits:
                    cpus: "0.5"
                    memory: 256M

    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: liqs
            # The app uses liqs; the init script creates liqs_test for tests
            POSTGRES_DB: liqs
        ports:
            # Use host port 5433 to avoid a local PostgreSQL instance on 5432
            - "5433:5432"
        volumes:
            - ./initdb:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d liqs"]
            interval: 2s
            timeout: 5s
            retries: 15
        deploy:
            resources:
                # Resource limits used during grading
                limits:
                    cpus: "1.0"
                    memory: 1G
