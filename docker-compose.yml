# Database used by the tests only.

# Start it with:  npm run up
# Stop it with:  docker compose down -v

# Host port is 5433 (not 5432) so this never touches the real database
services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: liqs
            POSTGRES_DB: liqs_test
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d liqs_test"]
            interval: 2s
            timeout: 5s
            retries: 15
