name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        name: Format, build, and test
        runs-on: ubuntu-latest
        timeout-minutes: 10

        env:
            HUSKY: 0

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: liqs
                    POSTGRES_DB: liqs_test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Validate Docker Compose
              run: docker compose config --quiet

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Build
              run: npm run build

            - name: Run tests
              run: npm test

            - name: Build Docker image
              run: docker build --tag log-ingestion-and-query-service:ci .
